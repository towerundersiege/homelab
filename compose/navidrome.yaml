services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: "${TZ:-Europe/London}"
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "24h"
    volumes:
      - "${CONFIG_ROOT:-/var/lib/homelab/config}/navidrome:/data"
      - "${MEDIA_ROOT:-/srv/media}/music:/music:ro"
    networks:
      - media
