services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/London}"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN:-towerundersiege.com}"
    volumes:
      - "${CONFIG_ROOT:-/var/lib/homelab/config}/jellyfin:/config"
      - "${MEDIA_ROOT:-/srv/media}:/data:ro"
    networks:
      - media
