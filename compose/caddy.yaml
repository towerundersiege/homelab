services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - filebrowser
      - jellyfin
      - navidrome
      - syncthing
    environment:
      ACME_EMAIL: "${ACME_EMAIL:-info@towerundersiege.com}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}"
      DOMAIN: "${DOMAIN:-towerundersiege.com}"
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:80:80/tcp"
      - "${TAILSCALE_IP:-127.0.0.1}:443:443/tcp"
      - "${TAILSCALE_IP:-127.0.0.1}:443:443/udp"
    volumes:
      - "${CONFIG_ROOT:-/var/lib/penzance/config}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${CONFIG_ROOT:-/var/lib/penzance/config}/caddy/data:/data"
      - "${CONFIG_ROOT:-/var/lib/penzance/config}/caddy/config:/config"
    networks:
      - edge
      - media
