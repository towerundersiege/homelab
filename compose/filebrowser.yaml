services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    healthcheck:
      disable: true
    command:
      - --address
      - 0.0.0.0
      - --port
      - "8080"
      - --root
      - /srv
      - --database
      - /database/filebrowser.db
    volumes:
      - "${FILES_ROOT:-/srv}:/srv"
      - "${CONFIG_ROOT:-/var/lib/homelab/config}/filebrowser:/database"
      - "${CONFIG_ROOT:-/var/lib/homelab/config}/filebrowser:/config"
    networks:
      - edge
