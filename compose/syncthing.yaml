services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: syncthing
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/London}"
    volumes:
      - "${CONFIG_ROOT:-/var/lib/homelab/config}/syncthing:/config"
      - "${SYNC_ROOT:-/srv/sync}:/sync"
      - "${MEDIA_ROOT:-/srv/media}:/media"
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    networks:
      - edge
      - media
