services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Europe/London}"
      TUNNEL_TOKEN: "${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN in .env}"
    command: tunnel --no-autoupdate run
    networks:
      - edge
      - media
