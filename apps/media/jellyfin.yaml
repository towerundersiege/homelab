apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: homelab-local
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: restore-metadata
          image: rancher/mirrored-library-busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              marker=/config/.homelab-metadata-restored
              if [ -e "$marker" ]; then
                exit 0
              fi
              tar -xzf /archive/homelab-migration/pre-debian-20260726-verified/penzance-state.tar.gz \
                -C /config --strip-components=5 var/lib/penzance/config/jellyfin
              chown -R 1000:1000 /config
              touch "$marker"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /archive
              readOnly: true
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls38
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/London
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.home.rpca.uk
          ports:
            - name: http
              containerPort: 8096
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          hostPath:
            path: /mnt/crimson/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jellyfin.home.rpca.uk
      secretName: media-home-rpca-uk-tls
  rules:
    - host: jellyfin.home.rpca.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
