apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: forgejo
      version: 17.1.4
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Forgejo 16 exposes the Actions job-log API used by the local Codex
    # connector. The Helm chart's appVersion remains on Forgejo 15, so pin the
    # supported rootless image explicitly.
    image:
      tag: "16.0.2"
    strategy:
      type: Recreate
    test:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      size: 30Gi
      storageClass: homelab-local
    gitea:
      admin:
        existingSecret: forgejo-admin
        passwordMode: initialOnlyRequireReset
      config:
        server:
          DOMAIN: forgejo.home.rpca.uk
          ROOT_URL: https://forgejo.home.rpca.uk/
        service:
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: true
        packages:
          ENABLED: true
        actions:
          ENABLED: true
