---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ homelab_packages }}"
    state: present
    update_cache: true

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51homelab-unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          "origin=Debian,codename=${distro_codename}-updates,label=Debian";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Ensure apt periodic timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure shared homelab group exists
  ansible.builtin.group:
    name: "{{ homelab_shared_group }}"
    gid: "{{ homelab_shared_gid }}"
    state: present

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: ansible_swaptotal_mb | int > 0

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Create shared storage mountpoint
  ansible.builtin.file:
    path: "{{ shared_storage_mountpoint }}"
    state: directory
    mode: "0755"
  when: "'proxmox_hosts' not in group_names"

- name: Mount shared storage from Proxmox NFS export
  ansible.posix.mount:
    src: "{{ shared_storage_nfs_export }}"
    path: "{{ shared_storage_mountpoint }}"
    fstype: nfs
    opts: "{{ shared_storage_mount_opts }}"
    state: mounted
  when: "'proxmox_hosts' not in group_names"

- name: Ensure bootstrap user has sudo access
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ bootstrap_user }}"
    mode: "0440"
    content: |
      {{ bootstrap_user }} ALL=(ALL) NOPASSWD:ALL
  when: "'proxmox_hosts' not in group_names"

- name: Create ryan group memberships
  ansible.builtin.user:
    name: "{{ ryan_user }}"
    shell: "{{ ryan_shell }}"
    groups: "{{ ryan_groups | join(',') }}"
    password: "{{ ryan_password_hashes[inventory_hostname] }}"
    update_password: always
    append: true
    create_home: true
    state: present
  when: "'proxmox_hosts' not in group_names"

- name: Ensure ryan has sudo access
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ryan_user }}"
    mode: "0440"
    content: |
      {{ ryan_user }} ALL=(ALL:ALL) NOPASSWD:ALL
    validate: /usr/sbin/visudo -cf %s
  when: "'proxmox_hosts' not in group_names"

- name: Ensure ryan .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ ryan_user }}/.ssh"
    state: directory
    owner: "{{ ryan_user }}"
    group: "{{ ryan_user }}"
    mode: "0700"
  when: "'proxmox_hosts' not in group_names"

- name: Install ryan authorized keys
  ansible.builtin.authorized_key:
    user: "{{ ryan_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ hostvars[inventory_hostname].terraform_ssh_public_keys | select('search', ' ryan@') | list }}"
  when:
    - "'proxmox_hosts' not in group_names"
    - hostvars[inventory_hostname].terraform_ssh_public_keys is defined

- name: Ensure ryan config directories exist
  ansible.builtin.file:
    path: "/home/{{ ryan_user }}/{{ item }}"
    state: directory
    owner: "{{ ryan_user }}"
    group: "{{ ryan_user }}"
    mode: "0755"
  loop:
    - .config
    - .config/zsh
    - .cache
    - .cache/zsh
    - .local
    - .local/bin
    - Projects
  when: "'proxmox_hosts' not in group_names"

- name: Render ryan zprofile
  ansible.builtin.template:
    src: ryan-zprofile.j2
    dest: "/home/{{ ryan_user }}/.config/zsh/.zprofile"
    owner: "{{ ryan_user }}"
    group: "{{ ryan_user }}"
    mode: "0644"
  when: "'proxmox_hosts' not in group_names"

- name: Link ryan zprofile
  ansible.builtin.file:
    src: "/home/{{ ryan_user }}/.config/zsh/.zprofile"
    dest: "/home/{{ ryan_user }}/.zprofile"
    state: link
    force: true
    owner: "{{ ryan_user }}"
    group: "{{ ryan_user }}"
  when: "'proxmox_hosts' not in group_names"

- name: Render ryan zshrc
  ansible.builtin.template:
    src: ryan-zshrc.j2
    dest: "/home/{{ ryan_user }}/.config/zsh/.zshrc"
    owner: "{{ ryan_user }}"
    group: "{{ ryan_user }}"
    mode: "0644"
  when: "'proxmox_hosts' not in group_names"

- name: Ensure ZDOTDIR is set for ryan
  ansible.builtin.copy:
    dest: "/home/{{ ryan_user }}/.zshenv"
    owner: "{{ ryan_user }}"
    group: "{{ ryan_user }}"
    mode: "0644"
    content: |
      export ZDOTDIR="$HOME/.config/zsh"
  when: "'proxmox_hosts' not in group_names"
