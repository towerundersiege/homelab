---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Allow ryan to manage Docker
  ansible.builtin.user:
    name: "{{ ryan_user }}"
    groups:
      - docker
      - "{{ homelab_shared_group }}"
    append: true

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Disable systemd-resolved DNS stub listener for Pi-hole
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/pihole.conf
    mode: "0644"
    content: |
      [Resolve]
      DNSStubListener=no
  notify: Restart systemd-resolved

- name: Create stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ docker_stack_root }}"
    - "{{ jellyfin_config_root }}"
    - "{{ penzance_data_root }}"
    - "{{ penzance_data_root }}/config"
    - "{{ penzance_data_root }}/config/caddy"
    - "{{ penzance_data_root }}/config/caddy/config"
    - "{{ penzance_data_root }}/config/caddy/data"
    - "{{ penzance_data_root }}/config/filebrowser"
    - "{{ penzance_data_root }}/config/isambard"
    - "{{ penzance_data_root }}/config/navidrome"
    - "{{ penzance_data_root }}/config/pihole"
    - "{{ penzance_data_root }}/config/pihole/dnsmasq.d"
    - "{{ penzance_data_root }}/config/portainer"
    - "{{ penzance_data_root }}/config/syncthing"
    - "{{ shared_storage_media_root }}"
    - "{{ shared_storage_media_root }}/movies"
    - "{{ shared_storage_media_root }}/music"
    - "{{ shared_storage_media_root }}/tv"
    - "{{ shared_storage_mountpoint }}/sync"

- name: Ensure shared content directories keep the homelab group
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    group: "{{ homelab_shared_group }}"
    mode: "2775"
  loop:
    - "{{ shared_storage_media_root }}"
    - "{{ shared_storage_media_root }}/movies"
    - "{{ shared_storage_media_root }}/music"
    - "{{ shared_storage_media_root }}/tv"
    - "{{ shared_storage_mountpoint }}/sync"

- name: Ensure Navidrome data directory is writable by the container user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ryan_user }}"
    group: "{{ homelab_shared_group }}"
    mode: "2775"
  loop:
    - "{{ penzance_data_root }}/config/navidrome"
    - "{{ penzance_data_root }}/config/filebrowser"
    - "{{ penzance_data_root }}/config/syncthing"
    - "{{ shared_storage_mountpoint }}/sync"

- name: Check required Docker stack secrets are rendered
  ansible.builtin.assert:
    that:
      - cloudflare_dns_api_token | length > 0
      - cloudflared_tunnel_token | length > 0
    fail_msg: "Required Docker stack runtime secrets are missing. Run ./scripts/homelab plan or apply so generated secret vars are refreshed before deploying penzance."
    quiet: true

- name: Remove conflicting Pi-hole custom.list overrides
  ansible.builtin.lineinfile:
    path: "{{ penzance_data_root }}/config/pihole/hosts/custom.list"
    regexp: "^.*\\s{{ item.domain | regex_escape }}$"
    state: absent
    create: false
  loop: "{{ pihole_dns_records }}"
  loop_control:
    label: "{{ item.domain }}"
  notify: Restart pihole container

- name: Remove conflicting Pi-hole TOML host overrides
  ansible.builtin.lineinfile:
    path: "{{ penzance_data_root }}/config/pihole/pihole.toml"
    regexp: "^.*{{ item.domain | regex_escape }}.*$"
    state: absent
    create: false
  loop: "{{ pihole_dns_records }}"
  loop_control:
    label: "{{ item.domain }}"
  notify: Restart pihole container

- name: Render Pi-hole local DNS records
  ansible.builtin.template:
    src: 05-local-dns.conf.j2
    dest: "{{ penzance_data_root }}/config/pihole/dnsmasq.d/05-local-dns.conf"
    mode: "0644"
  notify: Restart pihole container

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ penzance_data_root }}/config/caddy/Caddyfile"
    mode: "0640"
  notify: Restart caddy container

- name: Render penzance docker compose stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ penzance_compose_file }}"
    mode: "0640"

- name: Install Docker image update helper
  ansible.builtin.template:
    src: homelab-docker-update.sh.j2
    dest: /usr/local/sbin/homelab-docker-update
    owner: root
    group: root
    mode: "0755"

- name: Install Docker image update service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-docker-update.service
    mode: "0644"
    content: |
      [Unit]
      Description=Pull and apply homelab Docker Compose image updates
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/homelab-docker-update
  register: docker_update_service

- name: Install Docker image update timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-docker-update.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly homelab Docker Compose image update

      [Timer]
      OnCalendar=Sun 04:30
      Persistent=true
      RandomizedDelaySec=30m

      [Install]
      WantedBy=timers.target
  register: docker_update_timer

- name: Reload systemd after Docker update timer changes
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - docker_update_service.changed or docker_update_timer.changed

- name: Enable Docker image update timer
  ansible.builtin.systemd:
    name: homelab-docker-update.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Start penzance Docker stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_stack_root }}"
    state: present
    remove_orphans: true
