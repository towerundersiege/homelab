ansible_user: ansible
homelab_packages:
- apt-listchanges
- apt-transport-https
- ca-certificates
- curl
- dnsutils
- ethtool
- fzf
- git
- gpg
- htop
- iftop
- iperf3
- iproute2
- iputils-ping
- jq
- less
- net-tools
- nfs-common
- nmap
- rsync
- tcpdump
- tmux
- traceroute
- unattended-upgrades
- vim
- zsh
- zsh-syntax-highlighting
homelab_user_packages:
  ryan:
  - fzf
homelab_service_routes:
  pihole:
    domain: pihole.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: false
    compose_template: pihole.yml.j2
    compose: {}
  proxmox:
    domain: proxmox.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: false
    compose_template: null
    compose: {}
  jellyfin:
    domain: jellyfin.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: true
    gluetun: false
    compose_template: jellyfin.yml.j2
    compose: {}
  navidrome:
    domain: navidrome.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: true
    gluetun: false
    compose_template: navidrome.yml.j2
    compose: {}
  syncthing:
    domain: syncthing.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: false
    compose_template: syncthing.yml.j2
    compose: {}
  filebrowser:
    domain: filebrowser.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: false
    compose_template: filebrowser.yml.j2
    compose: {}
  jellyfin_firetv:
    domain: jellyfin-firetv.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: false
    compose_template: null
    compose: {}
  isambard:
    domain: isambard.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: true
    compose_template: isambard.yml.j2
    compose: {}
  portainer:
    domain: portainer.towerundersiege.com
    host: penzance
    local: true
    cloudflare_public: false
    gluetun: false
    compose_template: portainer.yml.j2
    compose: {}
  caddy:
    domain: caddy.towerundersiege.com
    host: penzance
    local: false
    cloudflare_public: false
    gluetun: false
    compose_template: caddy.yml.j2
    compose: {}
  cloudflared:
    domain: cloudflared.towerundersiege.com
    host: penzance
    local: false
    cloudflare_public: false
    gluetun: false
    compose_template: cloudflared.yml.j2
    compose: {}
homelab_docker_service_templates:
- gluetun.yml.j2
- pihole.yml.j2
- jellyfin.yml.j2
- navidrome.yml.j2
- syncthing.yml.j2
- filebrowser.yml.j2
- isambard.yml.j2
- portainer.yml.j2
- caddy.yml.j2
- cloudflared.yml.j2
homelab_gluetun_enabled: true
timezone: Europe/London
bootstrap_user: ansible
homelab_shared_group: homelab
homelab_shared_gid: 2100
ryan_user: ryan
ryan_groups:
- sudo
- homelab
ryan_shell: /usr/bin/zsh
shared_storage_mountpoint: /srv/shared
shared_storage_nfs_export: 192.168.1.100:/
shared_storage_mount_opts: rw,nfsvers=4.2,hard,timeo=600,retrans=2,noatime
shared_storage_vm_root: '{{ shared_storage_mountpoint }}/vm'
shared_storage_penzance_root: '{{ shared_storage_mountpoint }}/vm/penzance'
shared_storage_media_root: '{{ shared_storage_mountpoint }}/media'
proxmox_storage_disks:
- uuid: ca9854ac-263a-43c1-a64d-7f7554bebf2c
  mountpoint: /srv/disks/disk1
proxmox_storage_pool_path: /srv/storage/pool
proxmox_storage_pool_name: pool
proxmox_nfs_export_cidr: 192.168.1.0/24
proxmox_storage_vm_root: /srv/storage/pool/vm
proxmox_storage_penzance_root: /srv/storage/pool/vm/penzance
proxmox_storage_media_root: /srv/storage/pool/media
docker_stack_root: /opt/penzance
penzance_compose_file: '{{ docker_stack_root }}/docker-compose.yml'
penzance_data_root: /var/lib/penzance
jellyfin_config_root: /var/lib/penzance/config/jellyfin
pihole_host_ip: 192.168.1.101
pihole_dns_records:
- domain: cornwall.proxmox.towerundersiege.com
  ip: 192.168.1.100
- domain: cornwall.towerundersiege.com
  ip: 192.168.1.100
- domain: penzance.vm.towerundersiege.com
  ip: 192.168.1.101
- domain: penzance.towerundersiege.com
  ip: 192.168.1.101
- domain: pihole.towerundersiege.com
  ip: 192.168.1.101
- domain: proxmox.towerundersiege.com
  ip: 192.168.1.101
- domain: jellyfin.towerundersiege.com
  ip: 192.168.1.101
- domain: navidrome.towerundersiege.com
  ip: 192.168.1.101
- domain: syncthing.towerundersiege.com
  ip: 192.168.1.101
- domain: filebrowser.towerundersiege.com
  ip: 192.168.1.101
- domain: jellyfin-firetv.towerundersiege.com
  ip: 192.168.1.101
- domain: isambard.towerundersiege.com
  ip: 192.168.1.101
- domain: portainer.towerundersiege.com
  ip: 192.168.1.101
